function speak(text,locale){if(!('speechSynthesis' in window)){alert('Ce navigateur ne propose pas la lecture vocale.');return;}window.speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(text);msg.lang=locale;msg.rate=$('slow').checked?.74:.92;const voices=window.speechSynthesis.getVoices();msg.voice=voices.find(v=>v.lang.toLowerCase()===locale.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(locale.slice(0,2)))||null;window.speechSynthesis.speak(msg)}

function updateCounter(){$('counter').textContent=revealed[active].filter(Boolean).length+' / 20 corrections affichées'}
function displayAnswer(card,it,i){const present=revealed[active][i];const opt=card.querySelectorAll('.option');opt.forEach((n,k)=>n.classList.toggle('right',present && k===it.index));const old=card.querySelector('.solution');if(old)old.remove();const toggle=card.querySelector('.reveal');toggle.textContent=present?'🙈 Masquer la correction':'👁 Voir la correction';toggle.setAttribute('aria-expanded',present?'true':'false');if(present){const sol=el('div','solution');sol.setAttribute('role','status');sol.appendChild(el('b','', 'Correction'));sol.appendChild(el('div','answer',it.answers[0]));for(let k=1;k<it.answers.length;k++)sol.appendChild(el('span','alternative','Ou : '+it.answers[k]));sol.appendChild(btn('🔊 Écouter la correction','',()=>speak(it.answers.join('. O bien, '),'es-ES')));card.appendChild(sol)}updateCounter()}
function showAll(){const cards=$('questions').children;for(let i=0;i<cards.length;i++){revealed[active][i]=false;displayAnswer(cards[i],DATA[active].items[i],i)}}
function render(){const group=DATA[active];$('heading').textContent=group.title;$('instruct').textContent=INSTRUCTIONS[active];$('tabs').replaceChildren(...DATA.map((g,i)=>{const t=el('button','tab',g.title);t.type='button';t.setAttribute('aria-current',i===active?'true':'false');t.onclick=()=>{active=i;render();window.scrollTo({top:0,behavior:'smooth'})};return t}));const root=$('questions');root.replaceChildren();group.items.forEach((it,i)=>{const card=el('article','card');const q=el('div','qrow');q.append(el('span','qnum',String(i+1).padStart(2,'0')),el('div','prompt',it.q));card.appendChild(q);if(it.options){const options=el('div','options');it.options.forEach((o,k)=>options.appendChild(el('div','option',String.fromCharCode(97+k)+') '+o)));card.appendChild(options)}const actions=el('div','actions');actions.append(btn('🔊 Écouter l’énoncé','',()=>speak(it.audioText,it.audioLang)));const reveal=btn('','reveal',()=>{revealed[active][i]=!revealed[active][i];displayAnswer(card,it,i)});reveal.setAttribute('aria-expanded','false');actions.appendChild(reveal);card.appendChild(actions);root.appendChild(card);displayAnswer(card,it,i)});updateCounter()}
$('prev').onclick=()=>{active=(active+4)%5;render();window.scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{active=(active+1)%5;render();window.scrollTo({top:0,behavior:'smooth'})};$('hide').onclick=showAll;$('project').onclick=()=>{document.body.classList.toggle('projector');$('project').textContent=document.body.classList.contains('projector')?'↙ Taille normale':'⛶ Projection'};render();
</script></body></html>
